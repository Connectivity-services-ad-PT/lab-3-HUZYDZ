$kind: http-request
name: GET /health - response time threshold
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      if (pm.environment.get("env") === "local") {
          pm.test("Latency tren local duoi 1000ms", function () {
              pm.expect(pm.response.responseTime).to.be.below(1000);
          });
      }
order: 1000
