$kind: http-request
name: 'POST /events/iot - boundary value is handled correctly'
method: POST
url: '{{baseUrl}}/api/v1/events/iot'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "deviceId": "SENSOR-01",
      "eventType": "motion_detected",
      "value": 9999999,
      "timestamp": "2026-01-01T00:00:00Z"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Gia tri bien duoc xu ly dung quy tac nghiep vu", function () {
          pm.expect([201, 400, 422]).to.include(pm.response.code);
      });
order: 1000
