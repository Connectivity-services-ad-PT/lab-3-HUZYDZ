$kind: http-request
name: 'POST /analytics/rules - create aggregation config'
method: POST
url: '{{baseUrl}}/api/v1/analytics/rules'
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "teamName": "{{teamName}}",
      "ruleType": "aggregation",
      "threshold": 10
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP Status Code phai la 200 hoac 201", function () {
          pm.expect([200, 201]).to.include(pm.response.code);
      });
      pm.test("Response body phai tra ve dung dinh dang JSON", function () {
          pm.response.to.be.withBody;
          pm.response.to.be.json;
      });
order: 1000
