$kind: http-request
name: GET /analytics/reports/latest - invalid token is rejected
url: "{{baseUrl}}/api/v1/reports/daily"
method: GET
headers:
  Authorization: Bearer invalid-token-xyz
scripts:
  - type: afterResponse
    code: |-
      pm.test("Request khong co token hoac token sai phai bi tu choi 401/403", function () {
          pm.expect([401, 403]).to.include(pm.response.code);
      });
    language: text/javascript
order: 2000
