openapi: "3.0.3"
info:
  title: "Smart Campus — Lab 03 Analytics Contract"
  version: "1.0.0"
  description: "Hợp đồng API của hệ thống Analytics (Nhóm B5)."
  contact:
    name: "Trần Đoàn Quang Huy"
    email: "1771020359@sv.dainam.edu.vn"
servers:
  - url: "http://localhost:4010"
    description: "Prism mock server"
tags:
  - name: "health"
    description: "Kiểm tra trạng thái service"
  - name: "rules"
    description: "Quản lý cấu hình tổng hợp số liệu"
  - name: "reports"
    description: "Truy xuất dữ liệu báo cáo Dashboard"
security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: "getHealth"
      summary: "Kiểm tra trạng thái service"
      tags:
        - "health"
      security: []
      responses:
        "200":
          description: "Service đang hoạt động"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analytics/rules:
    post:
      operationId: "createMetricRule"
      summary: "Tạo cấu hình tổng hợp mới"
      tags:
        - "rules"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRequest"
      responses:
        "201":
          description: "Rule đã được tạo thành công"
          headers:
            Location:
              description: "URI của rule vừa tạo."
              schema:
                type: "string"
                format: "uri"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /analytics/rules/{ruleId}:
    get:
      operationId: "getRuleById"
      summary: "Lấy chi tiết cấu hình"
      tags:
        - "rules"
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: "Chi tiết cấu hình Rule"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: "deleteRule"
      summary: "Xóa cấu hình"
      tags:
        - "rules"
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "204":
          description: "Xóa thành công"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /analytics/reports/latest:
    get:
      operationId: "getLatestReports"
      summary: "Lấy báo cáo mới nhất"
      tags:
        - "reports"
      parameters:
        - name: "limit"
          in: "query"
          required: false
          description: "Số báo cáo tối đa."
          schema:
            type: "integer"
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: "Danh sách báo cáo"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "items"
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/AnalyticsReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"

  parameters:
    RuleId:
      name: "ruleId"
      in: "path"
      required: true
      description: "ID của cấu hình rule."
      schema:
        type: "string"
        format: "uuid"

  schemas:
    HealthStatus:
      type: "object"
      required:
        - "status"
        - "service"
        - "time"
      properties:
        status:
          type: "string"
          enum:
            - "ok"
        service:
          type: "string"
          minLength: 2
          maxLength: 80
        time:
          type: "string"
          format: "date-time"

    CreateRuleRequest:
      type: "object"
      required:
        - "ruleName"
        - "aggregateWindow"
        - "targetConfig"
      properties:
        ruleName:
          type: "string"
          minLength: 5
          maxLength: 100
        aggregateWindow:
          type: "string"
          enum:
            - "hourly"
            - "daily"
        description:
          type: "string"
          maxLength: 255
        targetConfig:
          $ref: "#/components/schemas/TargetConfig"

    MetricRule:
      allOf:
        - $ref: "#/components/schemas/CreateRuleRequest"
        - type: "object"
          required:
            - "id"
            - "status"
            - "createdAt"
          properties:
            id:
              type: "string"
              format: "uuid"
            status:
              type: "string"
              enum:
                - "active"
                - "inactive"
            createdAt:
              type: "string"
              format: "date-time"

    TargetConfig:
      type: "object"
      required:
        - "targetType"
      properties:
        targetType:
          type: "string"
          enum:
            - "DEVICE_TARGET"
            - "ZONE_TARGET"
        deviceId:
          type: "string"
          pattern: "^SENSOR-[0-9]{3}$"
        zoneId:
          type: "string"
          pattern: "^ZONE-[A-Z0-9]{2,}$"

    AnalyticsReport:
      type: "object"
      required:
        - "reportId"
        - "generatedAt"
        - "summaryData"
      properties:
        reportId:
          type: "string"
          format: "uuid"
        generatedAt:
          type: "string"
          format: "date-time"
        exportUrl:
          type: "string"
          format: "uri"
        summaryData:
          type: "object"
          additionalProperties: true

    ProblemDetails:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
      properties:
        type:
          type: "string"
          format: "uri"
        title:
          type: "string"
          minLength: 3
          maxLength: 120
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
          maxLength: 500
        instance:
          type: "string"
          format: "uri"

  responses:
    BadRequest:
      description: "Dữ liệu sai định dạng"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: "Thiếu token"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: "Không tìm thấy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnprocessableEntity:
      description: "Sai logic"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalServerError:
      description: "Lỗi máy chủ"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"