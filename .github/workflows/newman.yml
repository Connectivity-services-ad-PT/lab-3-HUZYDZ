name: Contract and Newman Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contracts
        run: npx @stoplight/spectral-cli lint contracts/analytics.openapi.yaml

      - name: Start Prism mock servers
        run: |
          nohup npx prism mock contracts/analytics.openapi.yaml -p 4010 > prism-analytics.log 2>&1 &
          nohup npx prism mock contracts/iot-ingestion.openapi.yaml -p 4012 > prism-iot.log 2>&1 &

      - name: Wait for mock servers
        run: npx wait-on http://localhost:4010/health http://localhost:4012/health --timeout 30000

      - name: Run Newman contract tests
        run: npx newman run postman/collections/FIT4110_lab03_analytics.postman_collection.json -e postman/environments/FIT4110_lab03_mock.postman_environment.json -r cli,junit,htmlextra --reporter-junit-export reports/newman-report.xml --reporter-htmlextra-export reports/newman-report.html

      - name: Show Prism logs on failure
        if: failure()
        run: cat prism-analytics.log prism-iot.log || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/